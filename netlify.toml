[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/quotes"
  to = "/.netlify/functions/quotes"
  status = 200

[[redirects]]
  from = "/api/quotes/refresh"
  to = "/.netlify/functions/quotes"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
